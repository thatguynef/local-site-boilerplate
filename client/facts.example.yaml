# Shape for client/facts.yaml. This copy is Example Plumbing, the sample on main.
# Copy it in a client repository and replace every value. Do not put secrets here.
# src/config/business.ts is still what the site reads.

business:
  name: Example Plumbing
  legal_name: Example Plumbing
  schema_type: Plumber
  trade: plumbing
  primary_service: Drain cleaning

contact:
  phone_display: "(555) 010-0199"
  phone_tel: "+15550100199"
  email: hello@example.com

address:
  street: 100 Main Street
  city: Example City
  region: CA
  postal_code: "90000"
  country: US

geo:
  latitude: 34.0522
  longitude: -118.2437

hours:
  - days:
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      - Saturday
    opens: "07:00"
    closes: "19:00"

hours_display: "Monday–Saturday, 7:00 a.m.–7:00 p.m."
locale: en_US
lang: en

service_area:
  summary: Example City and nearby neighborhoods
  primary_city: Example City
  cities:
    - name: Example City
      slug: example-city
  neighborhoods:
    - North Example
    - Old Town
    - River District

services:
  primary:
    - name: Drain cleaning
      slug: drain-cleaning
  offered:
    - name: Water heater repair
      slug: water-heater-repair
    - name: Leak detection
      slug: leak-detection

profiles:
  google_business_profile: ""
  facebook: ""
  yelp: ""

analytics:
  ga4: ""
  gtm: ""

